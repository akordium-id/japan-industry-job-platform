services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-jijp_db}
      MYSQL_USER: ${DB_USER:-jijp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      # Hanya bind ke localhost host untuk keamanan (tidak terbuka langsung ke internet publik)
      - "${DB_PORT_BIND:-127.0.0.1:3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      args:
        TURBO_TEAM: ""
        TURBO_TOKEN: ""
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-jijp_db}
      DB_USER: ${DB_USER:-jijp_user}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      SESSION_SECRET: ${SESSION_SECRET:-changeme_generate_strong_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SSO_PROVIDER_URL: ${SSO_PROVIDER_URL:-}
      SSO_JWT_PUBLIC_KEY: ${SSO_JWT_PUBLIC_KEY:-}
    ports:
      # Hanya bind ke localhost host untuk debugging internal jika diperlukan
      - "${API_PORT_BIND:-127.0.0.1:3001}:3001"
    volumes:
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        # Kosongkan secara default agar request API menggunakan relative URL /api
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PORT_WEB:-80}:80"

volumes:
  mysql_data:
  uploads_data:
